<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OnlineCourse{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7fb; }
    .navbar-brand { font-weight: 700; letter-spacing: .2px; }
    .hero { background: linear-gradient(120deg,#152c5b,#3867d6); color: white; border-radius: 1rem; }
    .card { border: 0; border-radius: 1rem; box-shadow: 0 8px 24px rgba(20,40,80,.08); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'onlinecourse:course_list' %}">OnlineCourse</a>
    <div class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
        <span class="navbar-text me-3">Hi, {{ user.username }}</span>
        <a class="nav-link" href="/admin/">Admin</a>
      {% else %}
        <a class="nav-link" href="/admin/login/">Admin login</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
